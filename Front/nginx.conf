# SPA + proxy para a API.
#
# O navegador conversa com uma origem so. Isso nao e conveniencia: e o que
# dispensa CORS, mantem o cookie irrelevante e faz o `/api` relativo do
# `lib/http.ts` funcionar igual no container e no `npm run dev`.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Barra final no proxy_pass de proposito: o prefixo /api e preservado,
    # porque os endpoints do Spring ja comecam com /api.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O worker do MSW precisa ser servido da raiz para valer no site inteiro, e
    # nunca pode vir do cache: um worker velho continuaria interceptando rotas
    # que ja tem backend.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-store";
    }

    # Hash no nome: o conteudo de /assets nunca muda sem o nome mudar junto.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rota de SPA: recarregar /carrinho tem que devolver o index, e nao 404 —
    # quem resolve o caminho e o React Router, no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
