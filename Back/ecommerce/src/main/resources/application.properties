spring.application.name=ecommerce

# Valores vem do .env da raiz. O default depois dos dois-pontos so serve para
# subir contra o docker compose sem exportar nada.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema e responsabilidade do Flyway. Hibernate so confere se bate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}

# Datas do dominio sempre em ISO 8601, nunca epoch numerico.
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------
# Seguranca: o Keycloak e o dono da identidade
# ---------------------------------------------------------------
# A API valida o JWT em toda requisicao. O issuer-uri precisa ser IDENTICO ao
# host que emitiu o token, senao a claim iss nao bate e o resource server
# recusa com 401 sem detalhe.
#
# Dentro do docker compose esse host e o publico (localhost:8081, que o
# navegador enxerga), enquanto o backend alcanca o Keycloak pelo nome do
# servico (keycloak:8080). Sao endereços diferentes para o mesmo servidor, por
# isso o jwk-set-uri e declarado a parte: sem ele o Spring tentaria descobrir as
# chaves na URL publica e nao chegaria la de dentro da rede do compose.
#
# Fora do Docker as duas variaveis apontam para o mesmo lugar e nada muda.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URL:${KEYCLOAK_URL:http://localhost:8081}}/realms/${KEYCLOAK_REALM:ecommerce}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://localhost:8081}/realms/${KEYCLOAK_REALM:ecommerce}/protocol/openid-connect/certs

# O login tambem passa por aqui: /api/autenticacao e um proxy para o Keycloak,
# entao o front nunca fala com ele. Lidos por KeycloakConfig; nenhum destes
# valores chega ao navegador.
keycloak.url=${KEYCLOAK_URL:http://localhost:8081}
keycloak.realm=${KEYCLOAK_REALM:ecommerce}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:ecommerce-api}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:segredo-de-desenvolvimento}

app.url-do-front=${URL_DO_FRONT:http://localhost:3000,http://localhost:5173}

# ---------------------------------------------------------------
# RabbitMQ: a cobranca sai por fila
# ---------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# Confirmacao de publicacao. `publicado_em` so e gravado depois do ack do
# broker: sem isso existiria uma janela em que o evento e dado como publicado e
# o RabbitMQ nunca o recebeu — e, sem worker de resgate, ninguem descobriria.
spring.rabbitmq.publisher-confirm-type=correlated

# `default-requeue-rejected=false` e o que manda a mensagem para a DLQ depois
# das tentativas. Ligado, ela voltaria para a fila e giraria para sempre, com o
# problema invisivel.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

# Broker fora do ar nao pode derrubar a subida da API: o outbox segura os
# eventos ate ele voltar.
spring.rabbitmq.connection-timeout=5s

# Intervalo do publicador do outbox.
app.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:2000}

# Marca o cookie de sessao como Secure. Falso em desenvolvimento porque
# http://localhost nao e HTTPS e o navegador descartaria o cookie sem avisar.
app.cookie-seguro=${COOKIE_SEGURO:false}
