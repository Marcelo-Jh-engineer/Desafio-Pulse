spring.application.name=ecommerce

# Valores vem do .env da raiz. O default depois dos dois-pontos so serve para
# subir contra o docker compose sem exportar nada.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5440/ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema e responsabilidade do Flyway. Hibernate so confere se bate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}

# Datas do dominio sempre em ISO 8601, nunca epoch numerico.
spring.jackson.serialization.write-dates-as-timestamps=false
