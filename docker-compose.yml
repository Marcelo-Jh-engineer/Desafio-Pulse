# Projeto inteiro de pe com um comando: banco, identidade, API e SPA.
# As variaveis vem do .env, que o compose carrega automaticamente.
#
#   docker compose up -d --build     sobe tudo
#   docker compose down              para, preservando o banco
#   docker compose down -v           para e ZERA o banco e o realm
#
# Depois de subir, a loja abre em http://localhost:${FRONT_PORT}.
services:
  banco:
    # Imagem oficial direto: nao havia nada de proprio para construir aqui, so
    # configuracao — e configuracao e o que o compose ja faz.
    image: postgres:16-alpine
    container_name: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Colacao e caixa pelo provedor ICU, em pt-BR.
      #
      # Nao e preciosismo: com o locale C que estava aqui antes, LOWER() nao
      # rebaixa letra acentuada maiuscula — LOWER('Agua') mantinha o "A" com
      # acento — e a busca do catalogo por "agua" em minusculas nao achava
      # "Agua Sanitaria". ICU faz o mapeamento de caixa direito e ainda ordena
      # em portugues, com acento junto da letra base.
      #
      # ICU e nao locale do sistema porque esta imagem e Alpine, que usa musl e
      # nao tem locale nenhum: pt_BR.UTF-8 simplesmente nao existe aqui. O ICU
      # vem dentro do PostgreSQL 16, entao o resultado e o mesmo em qualquer
      # maquina — que era a razao de ter escolhido o locale C no comeco.
      #
      # `--locale=C.UTF-8` continua ali para os LC_* que o ICU nao cobre.
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=pt-BR --locale=C.UTF-8'
    healthcheck:
      # O Flyway e o backend so podem conectar depois que o initdb terminar.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    ports:
      # 5440 no host de proposito: 5432 e 5433 ja sao ocupadas pelos servicos
      # nativos postgresql-x64-17 e -18 do Windows. Dentro do container e 5432.
      - '${DB_PORT}:5432'
    volumes:
      # Volume nomeado para o dado sobreviver a `docker compose down`.
      # Para zerar o banco: docker compose down -v
      - dados-postgres:/var/lib/postgresql/data
      # Roda so no primeiro start, com o volume vazio: cria a database do
      # Keycloak ao lado da database da aplicacao. Somente leitura porque o
      # container nao tem motivo para escrever no script.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro

  keycloak:
    build:
      context: .
      dockerfile: docker/keycloak/Dockerfile
    image: pulse-keycloak:26
    container_name: pulse-keycloak
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      # So opcoes de RUNTIME aqui. Realm, tema, vendor de banco e health ja
      # estao gravados na imagem por docker/keycloak/Dockerfile.
      KC_DB_URL: jdbc:postgresql://banco:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      # A claim `iss` do token nasce daqui. Precisa ser a MESMA URL que o front
      # usa para pegar o token, senao quem validar o JWT recusa por issuer.
      KC_HOSTNAME: ${KEYCLOAK_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      # 8081 no host: 8080 fica com o backend Spring.
      - '${KEYCLOAK_PORT}:8080'
    healthcheck:
      # A imagem do Keycloak nao traz curl nem wget, entao a sonda fala HTTP na
      # mao pelo /dev/tcp do bash. Os CR-LF do printf sao obrigatorios: com LF
      # puro o Quarkus nao fecha o cabecalho e a conexao morre sem resposta.
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep -q UP'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  broker:
    # RabbitMQ com o painel ligado: e por ele que se confere fila, binding e
    # DLQ sem precisar de cliente instalado na maquina.
    image: rabbitmq:3-management-alpine
    container_name: pulse-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      # O backend so pode subir depois que o broker aceita conexao: sem isso a
      # aplicacao sobe, tenta declarar as filas e reclama no log ate acertar.
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      # Painel. A porta 5672 (AMQP) NAO e publicada: quem fala com o broker e o
      # backend, pela rede interna do compose.
      - '${RABBITMQ_PAINEL_PORT}:15672'

  backend:
    build:
      context: ./Back/ecommerce
    image: pulse-backend:1
    container_name: pulse-backend
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      # Nome do servico, nao localhost: dentro da rede do compose cada container
      # tem o proprio localhost.
      DB_URL: jdbc:postgresql://banco:5432/${POSTGRES_DB}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080

      # Duas URLs para o mesmo Keycloak, e isso e proposital: KEYCLOAK_URL e por
      # onde o backend chega nele, KEYCLOAK_ISSUER_URL e o endereco que aparece
      # na claim `iss` do token, gravado pelo KC_HOSTNAME. Usar so uma faria o
      # backend ou nao alcancar o servidor, ou recusar todo token por issuer.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}

      # Origens aceitas pelo CORS, vindas do .env. No compose o nginx faz proxy
      # e tudo sai da mesma origem, entao isto so vale para quem chamar a API
      # direto — Swagger, curl ou o front em `npm run dev`.
      URL_DO_FRONT: ${URL_DO_FRONT}

      # Nome do servico, nao localhost — mesma razao do banco e do Keycloak.
      RABBITMQ_HOST: broker
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    ports:
      # Exposta para o Swagger e para teste direto com curl. O front nao usa
      # esta porta: ele fala com o nginx, que fala com o backend pela rede
      # interna.
      - '${SERVER_PORT}:8080'

  front:
    build:
      context: ./Front
      args:
        # Resolvido em tempo de build pelo Vite. Mudar exige `--build`.
        # Mesma origem: o nginx do proprio front faz proxy de /api para a API.
        VITE_API_BASE_URL: /api
    image: pulse-front:1
    container_name: pulse-front
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONT_PORT}:80'

volumes:
  dados-postgres:
