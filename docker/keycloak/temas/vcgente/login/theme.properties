# Tema de login do projeto. Estende o tema novo do Keycloak (PatternFly v5) em
# vez de reescrever a tela: so as cores, a tipografia e o mascote mudam.
parent=keycloak.v2
import=common/keycloak

# `styles` SUBSTITUI a lista do pai, entao css/styles.css precisa continuar
# aqui: sem ele a tela perde todo o layout e vira HTML cru.
styles=css/styles.css css/marca.css

# Uma lingua so: o projeto e de um supermercado brasileiro.
locales=pt-BR
